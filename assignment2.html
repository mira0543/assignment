<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         div {
            background-color: lightblue;
            width: 30%;
            height: 350px;
            box-shadow: 4px 2px 2px  grey;
            border-radius: 5px;
            text-align: center;
            margin-top: 30px;
            margin-left: 35%;

        }
        input {
            margin-left: 16px;
            border: none;
            border: 1px solid rgb(124, 118, 118);
            margin-top: 30px;
            border-radius: 10px;
            width: 300px;
            padding: 15px;
        }
        button {
            margin-top: 20px;
            padding:15px;
            width: 250px;
            border-radius: 15px;
            border: none;
            margin-left: 10px;
            background-color: rgb(96, 96, 197);
            cursor: pointer;
   
        }
        button:hover{
            background-color: rgb(59, 197, 59);
        }
    </style>
</head>
<body>
    <div>
        <h1>Checking marks result</h1>
        <input type="text" placeholder="name" id="nam">
        <input type="text" placeholder="marks" id="mark">
        <button id="btn">click here</button>
        <p id="btnoutput"></p>
        
    </div>
    <script>
        let name = document.getElementById("nam")
        let marks = document.getElementById("mark")
        let btn = document.getElementById("btn")
        let output =document.getElementById("btnoutput")

        btn.addEventListener("click",()=>{
            let nam = name.value;
            let mark = marks.value;
            if (nam === "" || mark === "") {
            btnoutput.textContent = "Please enter your name and marks";
            btnoutput.style.color = "red";
            return; 
        }
        if (mark < 0 || mark > 100) {
            btnoutput.textContent = "Please enter marks between 0 and 100";
            btnoutput.style.color = "red";
            return;
        }

        // Pass or fail logic
        if (mark < 50) {
            btnoutput.textContent = "You failed";
            btnoutput.style.color = "red";
        } else {
            btnoutput.textContent =  "You passed";
            btnoutput.style.color = "green";
        }
    });
      


    </script>
    
</body>
</html>
